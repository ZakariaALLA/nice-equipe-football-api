spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/football_nice_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true
    hibernate:
      ddl-auto: update
logging:
  level:
    com.francefootball.niceequipefootballapi: "debug"
